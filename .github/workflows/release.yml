name: Release

# Publishing a release makes the app from its tag and attaches it to it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      sign: true
    # A called workflow reads the secrets of the environment "release" only
    # when they are inherited; they cannot be passed by name.
    secrets: inherit

  upload:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
          path: package
      # --clobber lets a rerun replace what an earlier attempt attached.
      - run: gh release upload "$TAG" package/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
