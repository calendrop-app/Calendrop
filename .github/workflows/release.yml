name: Release

# Publishing a release makes the app from its tag and attaches it to it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      sign: true
      tag: ${{ github.event.release.tag_name }}
    # A called workflow reads the secrets of the environment "release" only
    # when they are inherited; they cannot be passed by name.
    secrets: inherit

  upload:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
          path: package
      # --clobber lets a rerun replace what an earlier attempt attached.
      - run: gh release upload "$TAG" package/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  # The site lists what this release ships, so it is built again once the
  # release holds the app. This repository's token cannot run another
  # repository's workflows, so a token that may run the site's is kept as a
  # secret.
  site:
    needs: upload
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: gh workflow run deploy.yml --repo calendrop-app/calendrop-app.github.io --ref main
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}

  # The Homebrew cask names the app of the latest release, so the tap writes
  # it again once the release holds the app. As for the site, a token that may
  # run the tap's workflows is kept as a secret.
  homebrew:
    needs: upload
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: gh workflow run update.yml --repo calendrop-app/homebrew-tap --ref main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
